name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；正在進行的部署不中斷
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 以最近一次資料檔提交時間作為更新時間，並在 Actions 摘要顯示本次是否有資料變更。
      - name: Check data changes and set timestamp
        id: data_status
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before || '' }}
        run: |
          DATA_PATHS=(
            src/data/skills.json
            src/data/set-skills.json
            src/data/armor.json
            src/data/monsters.json
            src/data/adventurers.json
            src/data/buddies.json
            scripts/manual_data.json
          )

          if [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            CHANGED_FILES="$(git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA" -- "${DATA_PATHS[@]}")"
          else
            # workflow_dispatch 比對目前 HEAD 的父提交；初始提交則直接檢查該提交的資料檔。
            if git rev-parse --verify "$GITHUB_SHA^" >/dev/null 2>&1; then
              CHANGED_FILES="$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA" -- "${DATA_PATHS[@]}")"
            else
              CHANGED_FILES="$(git diff-tree --root --no-commit-id --name-only -r "$GITHUB_SHA" -- "${DATA_PATHS[@]}")"
            fi
          fi

          if [[ -n "$CHANGED_FILES" ]]; then
            DATA_CHANGED=true
            DATA_CHANGED_LABEL='是'
          else
            DATA_CHANGED=false
            DATA_CHANGED_LABEL='否（沿用既有資料）'
          fi

          DATA_UPDATED_EPOCH="$(git log -1 --format=%ct -- \
            "${DATA_PATHS[@]}")"
          if [[ -z "$DATA_UPDATED_EPOCH" ]]; then
            echo "::error::Unable to determine the latest data update commit"
            exit 1
          fi
          TIMESTAMPS="$(node -e '
            function taipeiTime(date) {
              const parts = Object.fromEntries(new Intl.DateTimeFormat("en-GB", {
                timeZone: "Asia/Taipei",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hourCycle: "h23",
              }).formatToParts(date).map(({ type, value }) => [type, value]))
              return `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}+08:00`
            }
            const date = new Date(Number(process.argv[1]) * 1000)
            console.log(taipeiTime(date))
            console.log(taipeiTime(new Date()))
          ' "$DATA_UPDATED_EPOCH")"
          DATA_UPDATED_AT="$(echo "$TIMESTAMPS" | sed -n '1p')"
          CI_RUN_AT="$(echo "$TIMESTAMPS" | sed -n '2p')"

          echo "data_changed=$DATA_CHANGED" >> "$GITHUB_OUTPUT"
          echo "VITE_DATA_UPDATED_AT=$DATA_UPDATED_AT" >> "$GITHUB_ENV"

          {
            echo '## 資料更新狀態'
            echo "- 本次部署資料是否有更新：**$DATA_CHANGED_LABEL**"
            echo "- 資料更新時間（台灣時間）：**$DATA_UPDATED_AT**"
            echo "- 本次 CI 執行時間（台灣時間）：**$CI_RUN_AT**"
            if [[ -n "$CHANGED_FILES" ]]; then
              echo '- 本次變更的資料檔：'
              while IFS= read -r file; do
                [[ -n "$file" ]] && echo "  - \`$file\`"
              done <<< "$CHANGED_FILES"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 型別檢查 + 建置；網址路徑用 repo 名稱，改名也不用改程式
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
